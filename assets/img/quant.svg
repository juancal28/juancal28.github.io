<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a2d4a"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#00c853" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00c853" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2979ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2979ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g stroke="#1e3a5f" stroke-width="0.5" opacity="0.5">
    <line x1="100" y1="60" x2="100" y2="340"/>
    <line x1="220" y1="60" x2="220" y2="340"/>
    <line x1="340" y1="60" x2="340" y2="340"/>
    <line x1="460" y1="60" x2="460" y2="340"/>
    <line x1="580" y1="60" x2="580" y2="340"/>
    <line x1="700" y1="60" x2="700" y2="340"/>
    <line x1="100" y1="120" x2="700" y2="120"/>
    <line x1="100" y1="200" x2="700" y2="200"/>
    <line x1="100" y1="280" x2="700" y2="280"/>
  </g>
  <!-- Candlesticks -->
  <g>
    <!-- Candle 1 - green -->
    <line x1="140" y1="180" x2="140" y2="260" stroke="#00c853" stroke-width="1.5"/>
    <rect x="132" y="200" width="16" height="40" fill="#00c853" rx="1"/>
    <!-- Candle 2 - red -->
    <line x1="180" y1="170" x2="180" y2="250" stroke="#ff1744" stroke-width="1.5"/>
    <rect x="172" y="180" width="16" height="45" fill="#ff1744" rx="1"/>
    <!-- Candle 3 - green -->
    <line x1="220" y1="150" x2="220" y2="240" stroke="#00c853" stroke-width="1.5"/>
    <rect x="212" y="170" width="16" height="45" fill="#00c853" rx="1"/>
    <!-- Candle 4 - green -->
    <line x1="260" y1="130" x2="260" y2="210" stroke="#00c853" stroke-width="1.5"/>
    <rect x="252" y="145" width="16" height="40" fill="#00c853" rx="1"/>
    <!-- Candle 5 - red -->
    <line x1="300" y1="120" x2="300" y2="200" stroke="#ff1744" stroke-width="1.5"/>
    <rect x="292" y="130" width="16" height="50" fill="#ff1744" rx="1"/>
    <!-- Candle 6 - red -->
    <line x1="340" y1="140" x2="340" y2="220" stroke="#ff1744" stroke-width="1.5"/>
    <rect x="332" y="150" width="16" height="45" fill="#ff1744" rx="1"/>
    <!-- Candle 7 - green -->
    <line x1="380" y1="135" x2="380" y2="215" stroke="#00c853" stroke-width="1.5"/>
    <rect x="372" y="155" width="16" height="35" fill="#00c853" rx="1"/>
    <!-- Candle 8 - green -->
    <line x1="420" y1="110" x2="420" y2="190" stroke="#00c853" stroke-width="1.5"/>
    <rect x="412" y="125" width="16" height="40" fill="#00c853" rx="1"/>
    <!-- Candle 9 - green -->
    <line x1="460" y1="95" x2="460" y2="170" stroke="#00c853" stroke-width="1.5"/>
    <rect x="452" y="105" width="16" height="45" fill="#00c853" rx="1"/>
    <!-- Candle 10 - red -->
    <line x1="500" y1="100" x2="500" y2="180" stroke="#ff1744" stroke-width="1.5"/>
    <rect x="492" y="110" width="16" height="50" fill="#ff1744" rx="1"/>
    <!-- Candle 11 - green -->
    <line x1="540" y1="90" x2="540" y2="165" stroke="#00c853" stroke-width="1.5"/>
    <rect x="532" y="100" width="16" height="40" fill="#00c853" rx="1"/>
    <!-- Candle 12 - green -->
    <line x1="580" y1="80" x2="580" y2="150" stroke="#00c853" stroke-width="1.5"/>
    <rect x="572" y="90" width="16" height="35" fill="#00c853" rx="1"/>
  </g>
  <!-- Moving average line -->
  <polyline points="140,230 180,215 220,195 260,175 300,165 340,175 380,170 420,155 460,135 500,140 540,125 580,115"
    stroke="#2979ff" stroke-width="2" fill="none" opacity="0.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Sentiment indicator dots -->
  <g>
    <circle cx="220" cy="310" r="4" fill="#00c853" opacity="0.7"/>
    <circle cx="260" cy="305" r="5" fill="#00c853" opacity="0.8"/>
    <circle cx="300" cy="320" r="3" fill="#ff1744" opacity="0.6"/>
    <circle cx="340" cy="318" r="3.5" fill="#ff1744" opacity="0.6"/>
    <circle cx="420" cy="300" r="5" fill="#00c853" opacity="0.8"/>
    <circle cx="460" cy="295" r="6" fill="#00c853" opacity="0.9"/>
    <circle cx="540" cy="298" r="5" fill="#00c853" opacity="0.8"/>
    <circle cx="580" cy="292" r="5.5" fill="#00c853" opacity="0.85"/>
  </g>
  <!-- RAG label -->
  <rect x="600" y="75" width="120" height="32" rx="6" fill="#2979ff" opacity="0.15" stroke="#2979ff" stroke-width="1" stroke-opacity="0.4"/>
  <text x="660" y="96" text-anchor="middle" fill="#2979ff" font-family="monospace" font-size="13" font-weight="bold">RAG AGENT</text>
  <!-- News sentiment label -->
  <rect x="580" y="288" width="130" height="28" rx="6" fill="#00c853" opacity="0.1" stroke="#00c853" stroke-width="1" stroke-opacity="0.3"/>
  <text x="645" y="307" text-anchor="middle" fill="#00c853" font-family="monospace" font-size="11">SENTIMENT</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" fill="none">
  <!-- Illustrative only: the Limits screen, with one limit counting down its
       shared allowance, one in its block, and the day's two breaks.
       Type is set large because the tile shows this at about half size. -->
  <rect x="20.5" y="20.5" width="679" height="359" fill="#ffffff" stroke="#c3bdb4"/>

  <g font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" letter-spacing="1" fill="#6b6b6b">
    <text x="44" y="60" font-size="17" letter-spacing="2" fill="#1a1a1a">LIMITS</text>
    <text x="676" y="60" text-anchor="end" font-size="17" letter-spacing="2">MESSAGES</text>

    <text x="44" y="124">INSTAGRAM + 2</text>
    <text x="676" y="124" text-anchor="end" fill="#1a1a1a">11 / 15 MIN</text>

    <text x="44" y="216">YOUTUBE</text>
    <text x="676" y="216" text-anchor="end" fill="#1a1a1a">BLOCKED · 1:42 LEFT</text>

    <text x="44" y="324">BREAKS</text>
    <text x="495.5" y="324" text-anchor="middle" fill="#1a1a1a">10 MIN</text>
    <text x="621.5" y="324" text-anchor="middle" text-decoration="line-through">5 MIN</text>
  </g>

  <!-- the active tab -->
  <line x1="44" y1="72" x2="116" y2="72" stroke="#1a1a1a" stroke-width="2"/>

  <g stroke="#dcd8d2">
    <line x1="20" y1="84.5" x2="700" y2="84.5"/>
    <line x1="20" y1="176.5" x2="700" y2="176.5"/>
    <line x1="20" y1="268.5" x2="700" y2="268.5"/>
  </g>

  <!-- allowance used, and a block in force -->
  <rect x="44" y="142" width="632" height="8" fill="#dcd8d2"/>
  <rect x="44" y="142" width="463" height="8" fill="#1a1a1a"/>
  <rect x="44" y="234" width="632" height="8" fill="#1a1a1a"/>

  <!-- breaks: one left, one used -->
  <rect x="440.5" y="298.5" width="110" height="40" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="566.5" y="298.5" width="110" height="40" stroke="#c3bdb4"/>
</svg>
